name: Thumbnail scan

on:
  push:
    branches: [master, main]
    paths:
      - "**/*.io"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Extract missing thumbnails
        run: python extract_io_image.py --scan

      - name: Regenerate README build table
        run: python generate_readme.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*_thumbnail.png' '*.png' README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: extract thumbnails and refresh README"
            git push
          else
            echo "Nothing to commit"
          fi
